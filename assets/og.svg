<!--
  Source for the social preview image.
  Export to assets/og.png at 1200x630 and the build will pick it up automatically:
    rsvg-convert -w 1200 -h 630 assets/og.svg -o assets/og.png
  (or open it in any design tool and export a PNG)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff416c"/>
      <stop offset="1" stop-color="#aa003a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ff2d6d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2d6d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#050508"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g font-family="Outfit, system-ui, sans-serif" fill="#ffffff">
    <text x="88" y="250" font-size="34" fill-opacity="0.55" letter-spacing="1">hello, i'm</text>
    <text x="88" y="340" font-size="82" font-weight="700">lincoli xavier</text>
    <text x="88" y="410" font-size="30" fill-opacity="0.6">software engineer • entrepreneur • digital nomad</text>
  </g>

  <rect x="88" y="452" width="120" height="6" rx="3" fill="url(#accent)"/>
</svg>
