<p>A maior parte do que a gente persegue é <em>ruído</em>. O próximo lançamento, o próximo país, o próximo número.</p>
<p>A gente corre rápido o bastante pra esquecer que já <strong>está em algum lugar</strong>.</p>
<p class="life-closing">Continue perseguindo. Só não fique <span class="accent">ausente</span> da vida que você já tem.</p>
